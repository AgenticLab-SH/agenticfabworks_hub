<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="refresh" content="0; url=https://agenticfabworks.com/">
  <link rel="canonical" href="https://agenticfabworks.com/">
  <title>AgenticFabWorks로 이동</title>
</head>
<body>
  <p><a href="https://agenticfabworks.com/">AgenticFabWorks로 이동</a></p>
  <script>
    const base = "/agenticfabworks_hub";
    const path = location.pathname.startsWith(base)
      ? location.pathname.slice(base.length) || "/"
      : "/";
    location.replace(`https://agenticfabworks.com${path}${location.search}${location.hash}`);
  </script>
</body>
</html>
